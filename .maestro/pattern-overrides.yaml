appId: ${APP_ID}
name: Pattern overrides - a pattern's own fade to dark, haptics, sound and length
tags:
  - smoke
---
# Global: fade to dark on, after 30 s (long, because a loaded CI machine can take 10 s per command). Box overrides fade to Off; Slow follows the global setting.
- runFlow: subflows/launch.yaml
- tapOn:
    id: open-settings
- runFlow:
    when:
      visible:
        id: toggle-fade
        checked: false
    commands:
      - tapOn:
          id: toggle-fade
- tapOn:
    id: fade-delay-30
- tapOn:
    id: back

- tapOn:
    id: pattern-line
- scrollUntilVisible:
    element:
      id: info-box
- tapOn:
    id: info-box
- assertVisible:
    id: pattern-detail
# The evidence note lives here now (D14 wording, unchanged).
- assertVisible:
    id: pattern-evidence-note
- scrollUntilVisible:
    element:
      id: pt-target-m5
- tapOn:
    id: pt-target-m5
- assertVisible:
    id: pt-target-m5
    selected: true
- scrollUntilVisible:
    element:
      id: pt-fade-off
- tapOn:
    id: pt-fade-off
- assertVisible:
    id: pt-fade-off
    selected: true
- tapOn:
    id: pt-haptics-off
- assertVisible:
    id: pt-haptics-off
    selected: true
- tapOn:
    id: pt-sound-off
- assertVisible:
    id: pt-sound-off
    selected: true
- scrollUntilVisible:
    element:
      id: pattern-done
- tapOn:
    id: pattern-done
- assertVisible:
    id: patterns-sheet
- scrollUntilVisible:
    element:
      id: pattern-box
- tapOn:
    id: pattern-box
- assertVisible: "Box · 5 min"

# Box: fade is Off for this pattern, so a tap after the 30 s delay pauses straight away.
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 8000
- extendedWaitUntil:
    visible: "Hold"
    timeout: 10000
- runScript:
    file: scripts/sleep.js
    env:
      SLEEP_SECONDS: "33"
- tapOn:
    id: phase-label
- assertVisible:
    id: resume
- tapOn:
    id: end
# Past 20 s the session is saved and the end screen shows first.
- runFlow:
    when:
      visible:
        id: done
    commands:
      - tapOn:
          id: done
- assertVisible:
    id: home-screen

# Slow follows the global fade: after 30 s the first tap only wakes the screen, the second pauses.
- tapOn:
    id: pattern-line
- tapOn:
    id: duration-5
- tapOn:
    id: pattern-slow
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 8000
- extendedWaitUntil:
    visible: "Out"
    timeout: 8000
- runScript:
    file: scripts/sleep.js
    env:
      SLEEP_SECONDS: "33"
- tapOn:
    id: phase-label
- assertNotVisible:
    id: resume
- tapOn:
    id: phase-label
- assertVisible:
    id: resume
- tapOn:
    id: end
# Past 20 s the session is saved and the end screen shows first.
- runFlow:
    when:
      visible:
        id: done
    commands:
      - tapOn:
          id: done
- assertVisible:
    id: home-screen

# Restore: Box back to defaults, global fade delay back to 5 s.
- tapOn:
    id: pattern-line
- scrollUntilVisible:
    element:
      id: info-box
- tapOn:
    id: info-box
- scrollUntilVisible:
    element:
      id: pt-target-default
- tapOn:
    id: pt-target-default
- scrollUntilVisible:
    element:
      id: pt-fade-default
- tapOn:
    id: pt-fade-default
- tapOn:
    id: pt-haptics-default
- tapOn:
    id: pt-sound-default
- scrollUntilVisible:
    element:
      id: pattern-done
- tapOn:
    id: pattern-done
- scrollUntilVisible:
    direction: UP
    element:
      id: pattern-slow
- tapOn:
    id: pattern-slow
- tapOn:
    id: open-settings
- tapOn:
    id: fade-delay-5
- tapOn:
    id: back
