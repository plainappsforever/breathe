appId: ${APP_ID}
name: Experience - haptic strength, volume, end sound, fade delay, visuals, accent, text size, motion, shake
tags:
  - smoke
---
# v3 P3 settings. Preconditions are absolute (explicit taps / conditional toggles), never leftovers.
- runFlow: subflows/launch.yaml
- tapOn:
    id: open-settings
- assertVisible:
    id: settings-screen

# Haptics: on, strength slider (drag/tap the track, or the - / + buttons), 10..100 %.
- scrollUntilVisible:
    element:
      id: haptics-on
    centerElement: true
- tapOn:
    id: haptics-on
# (P7 added a row above: bring the slider and its buttons away from the bottom edge.)
- scrollUntilVisible:
    element:
      id: strength-up
    centerElement: true
- assertVisible:
    id: strength
# (Taps stay off the very edge of the track: a tap exactly on the edge pixel misses it.)
- tapOn:
    id: strength
    point: 90%,50%
- assertVisible:
    id: strength-value
    text: 90%
- tapOn:
    id: strength-down
- assertVisible:
    id: strength-value
    text: 85%
- tapOn:
    id: strength
    point: 10%,50%
- assertVisible:
    id: strength-value
    text: 20%
- tapOn:
    id: strength-up
- assertVisible:
    id: strength-value
    text: 25%

# Sound on -> volume slider and end sounds.
- runFlow:
    when:
      visible:
        id: toggle-sound
        checked: false
    commands:
      - tapOn:
          id: toggle-sound
- scrollUntilVisible:
    element:
      id: volume
- tapOn:
    id: volume
    point: 90%,50%
- assertVisible:
    id: volume-value
    text: 90%
- tapOn:
    id: volume-down
- assertVisible:
    id: volume-value
    text: 85%
- tapOn:
    id: endsound-bell
- assertVisible:
    id: endsound-bell
    selected: true
- tapOn:
    id: endsound-bowl
- assertVisible:
    id: endsound-bowl
    selected: true
- tapOn:
    id: endsound-none
- assertVisible:
    id: endsound-none
    selected: true

# Fade to dark with its delay.
- scrollUntilVisible:
    element:
      id: toggle-fade
    direction: UP
- runFlow:
    when:
      visible:
        id: toggle-fade
        checked: false
    commands:
      - tapOn:
          id: toggle-fade
- tapOn:
    id: fade-delay-30
- assertVisible:
    id: fade-delay-30
    selected: true
- tapOn:
    id: fade-delay-3
- assertVisible:
    id: fade-delay-3
    selected: true

# Shake to pause is opt-in; turning it on asks for nothing (no permission).
- runFlow:
    when:
      visible:
        id: toggle-shake
        checked: true
    commands:
      - tapOn:
          id: toggle-shake
- tapOn:
    id: toggle-shake
- assertVisible:
    id: toggle-shake
    checked: true

# Appearance: accent, visual, reduce motion, text size.
- scrollUntilVisible:
    element:
      id: accent-teal
    centerElement: true
- tapOn:
    id: accent-teal
- assertVisible:
    id: accent-teal
    selected: true
- scrollUntilVisible:
    element:
      id: visual-ring
    centerElement: true
- tapOn:
    id: visual-ring
- assertVisible:
    id: visual-ring
    selected: true
- scrollUntilVisible:
    element:
      id: text-large
    centerElement: true
- tapOn:
    id: text-large
- assertVisible:
    id: text-large
    selected: true
# Reduce motion sits above Text size: scroll back up to it (v3.1, taller Session section).
- scrollUntilVisible:
    element:
      id: toggle-reduce-motion
    direction: UP
    centerElement: true
- runFlow:
    when:
      visible:
        id: toggle-reduce-motion
        checked: false
    commands:
      - tapOn:
          id: toggle-reduce-motion
- assertVisible:
    id: toggle-reduce-motion
    checked: true

# It all survives a restart.
- stopApp
- runFlow: subflows/launch.yaml
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: strength-value
    centerElement: true
- assertVisible:
    id: strength-value
    text: 25%
- scrollUntilVisible:
    element:
      id: volume-value
    centerElement: true
- assertVisible:
    id: volume-value
    text: 85%
- assertVisible:
    id: endsound-none
    selected: true
- scrollUntilVisible:
    element:
      id: accent-teal
    centerElement: true
- assertVisible:
    id: accent-teal
    selected: true
- scrollUntilVisible:
    element:
      id: visual-ring
    centerElement: true
- assertVisible:
    id: visual-ring
    selected: true
- scrollUntilVisible:
    element:
      id: text-large
- assertVisible:
    id: text-large
    selected: true
- tapOn:
    id: back
# Fade to dark off, so one tap on the screen pauses instead of only waking it (fade itself is covered above
# and in pattern-overrides.yaml).
- runFlow: subflows/fade-off.yaml

# Every visual runs a session: ring (large text, reduced motion), text, bar, orb.
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 8000
- assertVisible:
    id: orb
- tapOn:
    id: phase-label
- tapOn:
    id: end
- assertVisible:
    id: home-screen

- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: visual-text
- tapOn:
    id: visual-text
- tapOn:
    id: back
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 8000
- assertVisible: "In"
- tapOn:
    id: phase-label
- tapOn:
    id: end
- assertVisible:
    id: home-screen

- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: visual-bar
- tapOn:
    id: visual-bar
- tapOn:
    id: back
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 8000
- tapOn:
    id: phase-label
- tapOn:
    id: end
- assertVisible:
    id: home-screen

# Restore the defaults for other flows and the owner's first launch.
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: visual-orb
- tapOn:
    id: visual-orb
- scrollUntilVisible:
    element:
      id: text-default
- tapOn:
    id: text-default
- scrollUntilVisible:
    element:
      id: accent-blue
    direction: UP
- tapOn:
    id: accent-blue
- scrollUntilVisible:
    element:
      id: toggle-reduce-motion
- runFlow:
    when:
      visible:
        id: toggle-reduce-motion
        checked: true
    commands:
      - tapOn:
          id: toggle-reduce-motion
- scrollUntilVisible:
    element:
      id: toggle-shake
    direction: UP
- runFlow:
    when:
      visible:
        id: toggle-shake
        checked: true
    commands:
      - tapOn:
          id: toggle-shake
- scrollUntilVisible:
    element:
      id: toggle-fade
    direction: UP
- runFlow:
    when:
      visible:
        id: toggle-fade
        checked: false
    commands:
      - tapOn:
          id: toggle-fade
- tapOn:
    id: fade-delay-5
- scrollUntilVisible:
    element:
      id: endsound-chime
- tapOn:
    id: endsound-chime
- tapOn:
    id: volume
    point: 90%,50%
- tapOn:
    id: volume-up
- tapOn:
    id: volume-up
- assertVisible:
    id: volume-value
    text: 100%
- scrollUntilVisible:
    element:
      id: strength
    direction: UP
- tapOn:
    id: strength
    point: 90%,50%
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- tapOn:
    id: strength-down
- assertVisible:
    id: strength-value
    text: 45%
