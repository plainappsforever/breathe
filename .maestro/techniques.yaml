appId: ${APP_ID}
name: Techniques - new patterns, search, favourites, About this pattern, safety and evidence pages
tags:
  - smoke
---
- runFlow: subflows/launch.yaml
# Absolute preconditions: fade to dark off (a tap must pause, not just wake), 3 minutes.
- tapOn:
    id: open-settings
- runFlow:
    when:
      visible:
        id: toggle-fade
        checked: true
    commands:
      - tapOn:
          id: toggle-fade
- tapOn:
    id: back
- tapOn:
    id: pattern-line
- assertVisible:
    id: patterns-sheet
- tapOn:
    id: duration-3

# Search: three resonance paces, nothing else.
- scrollUntilVisible:
    element:
      id: pattern-search
- tapOn:
    id: pattern-search
- inputText: "resonance"
- hideKeyboard
- assertVisible:
    id: pattern-res-55
- assertVisible:
    id: pattern-res-6
- assertVisible:
    id: pattern-res-45
- assertNotVisible:
    id: pattern-slow
- tapOn:
    id: pattern-search
- eraseText: 20
- inputText: "zzz"
- hideKeyboard
- assertVisible:
    id: pattern-no-match
- tapOn:
    id: pattern-search
- eraseText: 20
- inputText: "long exhale"
- hideKeyboard
- assertVisible:
    id: pattern-long-exhale
- assertNotVisible:
    id: pattern-box

# Favourites: make sure Long exhale starts un-starred, star it, and it moves to the top group.
- runFlow:
    when:
      visible:
        id: fav-long-exhale
        selected: true
    commands:
      - tapOn:
          id: fav-long-exhale
- assertVisible:
    id: fav-long-exhale
    selected: false
- tapOn:
    id: fav-long-exhale
- assertVisible:
    id: fav-long-exhale
    selected: true
- tapOn:
    id: pattern-search
- eraseText: 20
- hideKeyboard
- assertVisible: "Favourites"
- assertVisible:
    id: pattern-long-exhale

# About this pattern: pace, what it is, what is uncertain (Long exhale has no holds and no caution).
- tapOn:
    id: info-long-exhale
- assertVisible:
    id: pattern-detail
- assertVisible: "About 5 breaths a minute.*"
- assertVisible:
    id: pattern-about-what
- assertNotVisible:
    id: pattern-caution
- scrollUntilVisible:
    element:
      id: pattern-about-uncertain
- assertVisible:
    id: pattern-study-link
- scrollUntilVisible:
    element:
      id: pattern-done
- tapOn:
    id: pattern-done
- assertVisible:
    id: patterns-sheet

# A pattern with holds carries a caution line.
- scrollUntilVisible:
    element:
      id: info-box
- tapOn:
    id: info-box
- assertVisible:
    id: pattern-caution
- scrollUntilVisible:
    element:
      id: pattern-done
- tapOn:
    id: pattern-done

# Un-star Long exhale again (leave no state behind).
- scrollUntilVisible:
    direction: UP
    element:
      id: fav-long-exhale
- tapOn:
    id: fav-long-exhale
- assertNotVisible: "Favourites"

# New presets run: Short sigh (1.5 in, 0.5 sip, 4 out) reaches "Out" in about two seconds.
- scrollUntilVisible:
    element:
      id: pattern-short-sigh
- tapOn:
    id: pattern-short-sigh
- assertVisible: "Short sigh · 3 min"
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 8000
- extendedWaitUntil:
    visible: "Out"
    timeout: 8000
- tapOn:
    id: phase-label
- assertVisible:
    id: resume
- tapOn:
    id: end
- assertVisible:
    id: home-screen

# A hold pattern from the new set runs too: Triangle reaches "Hold".
- tapOn:
    id: pattern-line
- scrollUntilVisible:
    element:
      id: pattern-triangle
- tapOn:
    id: pattern-triangle
- assertVisible: "Triangle · 3 min"
- tapOn:
    id: start
- extendedWaitUntil:
    visible: "Hold"
    timeout: 15000
- tapOn:
    id: phase-label
- tapOn:
    id: end
- assertVisible:
    id: home-screen

# Back to the default pattern for the flows that follow.
- tapOn:
    id: pattern-line
- tapOn:
    id: pattern-slow

# About: safety education and the evidence page.
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: open-about
- tapOn:
    id: open-about
- assertVisible:
    id: about-safety-line
- assertVisible: "Holds are never required.*"
- scrollUntilVisible:
    element:
      text: "How to read the evidence"
- scrollUntilVisible:
    element:
      id: about-note-long-exhale
- scrollUntilVisible:
    element:
      id: about-note-short-sigh
