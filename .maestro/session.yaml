appId: ${APP_ID}
name: Session - one tap to breathing, pause, early end skips the end screen
tags:
  - smoke
---
- runFlow: subflows/launch.yaml
# Each flow makes its own preconditions absolute (not relying on another flow's leftover state):
# fade to dark off (so a single tap always pauses instead of just waking a dimmed screen, SPEC "any
# touch brings the screen back") and pattern back to Slow (so the In/Out timing below is predictable).
- tapOn:
    id: open-settings
- runFlow:
    when:
      visible:
        id: toggle-fade
        checked: true
    commands:
      - tapOn:
          id: toggle-fade
- tapOn:
    id: back
- assertVisible:
    id: home-screen
- tapOn:
    id: pattern-line
- tapOn:
    id: pattern-slow
# (pattern-selection persistence is covered by patterns.yaml; just need it applied before relaunching)
- assertVisible:
    id: home-screen
- stopApp
- runFlow: subflows/launch.yaml

# Acceptance 4 + 10: cold launch to "In" is exactly one tap, no dialog or system sheet anywhere.
# Pausing right after "In" (rather than also waiting to observe "Out") keeps this comfortably under
# the 20s save threshold on a loaded simulator; phase advancement itself is covered by
# session-engine.test.ts and by full-session.yaml running a session to completion.
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: phase-label
    timeout: 5000
- assertVisible: "In"
- tapOn:
    id: phase-label
- assertVisible:
    id: resume
- assertVisible:
    id: end
- tapOn:
    id: end
# Ran well under 20s: no end-screen, straight back to home (SPEC "End view").
- assertVisible:
    id: home-screen
- assertNotVisible:
    id: end-screen
